# Durable Object hub đẩy tín hiệu realtime.
# Worker nằm ở realtime-worker/, deploy riêng:
#   cd realtime-worker && npx wrangler deploy
# (Cloudflare không cho tạo Durable Object trong project Pages.)
[[services]]
binding = "REALTIME"
service = "zgo-realtime"

# Khoá ký token phiên (HMAC-SHA256). Đặt một lần:
#   npx wrangler pages secret put AUTH_SECRET --project-name cuahangtienloizgo
# Không đặt thì API tự sinh khoá ngẫu nhiên và lưu vào bảng sync_meta của D1 —
# vẫn chạy bình thường, chỉ là không xoay khoá được nếu mất DB.
# KHÔNG ghi secret vào file này (file được commit).
